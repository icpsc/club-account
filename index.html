<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易學社記帳系統</title>
    <style>
        :root {
            --primary: #1e3a8a;       /* 主色調：經典深藍（或可改為太極玄黑 #1a1a1a） */
    --primary-hover: #1e40af; /* 滑鼠懸停顏色 */
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #cbd5e1;
            --debit-bg: #eff6ff;
            --debit-text: #1d4ed8;
            --credit-bg: #fff7ed;
            --credit-text: #c2410c;
            --success: #16a34a;
            --danger: #dc2626;
            --warning-bg: #fefce8;
            --warning-border: #fef08a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 850px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }

        h2, h3 { color: var(--primary); margin-top: 0; letter-spacing: -0.025em; }
        h2 { text-align: center; font-size: 1.6rem; margin-bottom: 24px; }
        h3 { font-size: 1.25rem; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }

        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.9em; color: #475569; }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            color: #0f172a;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .section-title {
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 0.95em;
        }

        .debit-header { background-color: var(--debit-bg); color: var(--debit-text); border-left: 4px solid var(--debit-text); }
        .credit-header { background-color: var(--credit-bg); color: var(--credit-text); border-left: 4px solid var(--credit-text); }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .status { margin-top: 18px; font-weight: 600; text-align: center; font-size: 0.95em; }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .inventory-item {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px 16px;
            border-left: 4px solid var(--primary);
        }

        .inventory-item .title { font-size: 0.85em; color: #64748b; font-weight: 600; }
        .inventory-item .count { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-top: 4px; }

        .totals-table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
        .totals-table th, .totals-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
        .totals-table th { background-color: #f8fafc; color: #475569; font-weight: 600; }

        /* 表單審核卡片樣式 */
        .pending-card {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pending-info { font-size: 0.9em; line-height: 1.5; }
        .btn-apply {
            background: var(--success);
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            width: auto;
            margin-top: 0;
        }

        @media (max-width: 640px) {
            body { padding: 12px; margin: 10px auto; }
            .card { padding: 18px; }
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
            .pending-card { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>易學社記帳系統</h2>
    
    <form id="accountingForm">
        <input type="hidden" id="fromFormRowIndex" value="">

        <div class="grid-2">
            <div class="form-group">
                <label>交易日期</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>經手 / 記帳人</label>
                <select id="createdBy" required>
                    <option value="">-- 請選擇幹部 --</option>
                    <option value="總務">總務</option>
                    <option value="社長">社長</option>
                    <option value="副總務">副總務</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>交易摘要 / 事由說明 (選填)</label>
                <input type="text" id="description" placeholder="例如：張小明購買藍本教材">
            </div>
            <div class="form-group">
                <label>教材數量 / 本數</label>
                <input type="number" id="quantity" placeholder="0" min="0" value="0">
            </div>
        </div>

        <!-- 借方區塊 (開放四大類) -->
        <div class="form-group">
            <div class="section-title debit-header">【借方 Debit】資金流入 / 費用發生 / 負債減少</div>
            <div class="grid-3">
                <div>
                    <label>大類</label>
                    <select id="debitCategory" onchange="updateMainOptions('debit')" required>
                        <option value="">-- 請選擇 --</option>
                    </select>
                </div>
                <div>
                    <label>主項目</label>
                    <select id="debitMain" onchange="updateSubOptions('debit')" required>
                        <option value="">-- 請先選大類 --</option>
                    </select>
                </div>
                <div>
                    <label>次級子項目</label>
                    <select id="debitSub" required>
                        <option value="">-- 請先選主項目 --</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label>借方金額 ($)</label>
                <input type="number" id="debitAmount" placeholder="0" min="1" required>
            </div>
        </div>

        <!-- 貸方區塊 (開放四大類) -->
        <div class="form-group">
            <div class="section-title credit-header">【貸方 Credit】資金流出 / 收入增加 / 負債增加</div>
            <div class="grid-3">
                <div>
                    <label>大類</label>
                    <select id="creditCategory" onchange="updateMainOptions('credit')" required>
                        <option value="">-- 請選擇 --</option>
                    </select>
                </div>
                <div>
                    <label>主項目</label>
                    <select id="creditMain" onchange="updateSubOptions('credit')" required>
                        <option value="">-- 請先選大類 --</option>
                    </select>
                </div>
                <div>
                    <label>次級子項目</label>
                    <select id="creditSub" required>
                        <option value="">-- 請先選主項目 --</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label>貸方金額 ($)</label>
                <input type="number" id="creditAmount" placeholder="0" min="1" required>
            </div>
        </div>

        <button type="submit" id="submitBtn">提交帳目</button>
    </form>

    <div id="status" class="status"></div>
</div>

<!-- 待審核表單看板 -->
<div class="card">
    <h3>📋 待審核 Google 表單交易</h3>
    <div id="pendingFormsContainer">
        <div style="color: #64748b;">載入待審核表單中...</div>
    </div>
</div>

<!-- 庫存看板 -->
<div class="card">
    <h3>📦 教材即時庫存看板</h3>
    <div id="inventoryContainer" class="inventory-grid">
        <div style="color: #64748b;">載入庫存數據中...</div>
    </div>
</div>

<!-- 各子項目累計 -->
<div class="card">
    <h3>💰 各子項目累計金額統計</h3>
    <table class="totals-table">
        <thead>
            <tr>
                <th>主項目 - 子項目</th>
                <th style="text-align: right;">累計總金額 ($)</th>
            </tr>
        </thead>
        <tbody id="subTotalsContainer">
            <tr><td colspan="2" style="color: #64748b;">載入統計數據中...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // ⚠️ 請替換為您的 Google Apps Script 部署 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwnZr5t8HrY7pMwE4AoW-6XgSN8jD6je8SGeQRVtbzH0oF64QG3tZKqOqwF8Q_fOlkf/exec";

    const accountTree = {
        "收入": {
            "教材收入": [
                "學生紫微斗數正統（黃本）", "社會人士紫微斗數正統（黃本）",
                "學生紫微斗數論命實例（藍本）", "社會人士紫微斗數論命實例（藍本）",
                "學生花甲子納音", "社會人士花甲子納音",
                "善本易經", "學生易經占卜牌", "社會人士易經占卜牌",
                "命理基礎篇", "神相全編"
            ],
            "社費收入": [
                "學生週二", "社會人士週二",
                "學生週三", "社會人士週三",
                "學生合報", "社會人士合報"
            ]
        },
        "費損": {
            "活動支出": ["場地租用", "茶水餐飲", "宣傳印製", "老師", "社員聚餐", "其他"],
            "行政支出": ["教室租用", "影印費", "軟體訂閱", "其他"]
        },
        "資產": {
            "現金與存款": ["社團郵局帳戶", "現金"],
            "教材庫存": [
                "紫微斗數正統（黃本）", "紫微斗數論命實例（藍本）", "花甲子納音",
                "善本易經", "易經占卜牌", "命理基礎篇", "神相全編"
            ]
        },
        "負債": {
            "預收款": ["教材"]
        }
    };

    const priceRules = {
        "紫微斗數正統（黃本）": { "學生": 200, "社會人士": 400 },
        "紫微斗數論命實例（藍本）": { "學生": 300, "社會人士": 800 },
        "花甲子納音": { "學生": 400, "社會人士": 1200 },
        "善本易經": { "學生": 300, "社會人士": 300 },
        "易經占卜牌": { "學生": 800, "社會人士": 1000 },
        "命理基礎篇": { "學生": 200, "社會人士": 200 },
        "神相全編": { "學生": 300, "社會人士": 300 },
        "紫微斗數": { "學生": 200, "社會人士": 800 },
        "易經占卜牌社費": { "學生": 200, "社會人士": 800 },
        "合報": { "學生": 300, "社會人士": 1200 }
    };

    window.onload = function() {
        document.getElementById('date').valueAsDate = new Date();
        initCategories('debit');
        initCategories('credit');
        fetchDashboardData();
    };

    function initCategories(side) {
        const catSelect = document.getElementById(`${side}Category`);
        catSelect.innerHTML = '<option value="">-- 請選擇 --</option>';
        Object.keys(accountTree).forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.innerText = cat;
            catSelect.appendChild(opt);
        });
    }

    function updateMainOptions(side) {
        const cat = document.getElementById(`${side}Category`).value;
        const mainSelect = document.getElementById(`${side}Main`);
        const subSelect = document.getElementById(`${side}Sub`);

        mainSelect.innerHTML = '<option value="">-- 請選擇主項目 --</option>';
        subSelect.innerHTML = '<option value="">-- 請先選主項目 --</option>';

        if (cat && accountTree[cat]) {
            Object.keys(accountTree[cat]).forEach(main => {
                const opt = document.createElement("option");
                opt.value = main;
                opt.innerText = main;
                mainSelect.appendChild(opt);
            });
        }
    }

    function updateSubOptions(side) {
        const cat = document.getElementById(`${side}Category`).value;
        const main = document.getElementById(`${side}Main`).value;
        const subSelect = document.getElementById(`${side}Sub`);

        subSelect.innerHTML = '<option value="">-- 請選擇次級子項目 --</option>';

        if (cat && main && accountTree[cat][main]) {
            accountTree[cat][main].forEach(sub => {
                const opt = document.createElement("option");
                opt.value = sub;
                opt.innerText = sub;
                subSelect.appendChild(opt);
            });
        }
    }

    function fetchDashboardData() {
        fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
            if (data.result === "success") {
                renderInventory(data.inventory);
                renderSubTotals(data.subTotals);
                renderPendingForms(data.pendingForms);
            }
        })
        .catch(err => console.error("資料載入失敗:", err));
    }

    function renderPendingForms(forms) {
        const container = document.getElementById('pendingFormsContainer');
        container.innerHTML = "";
        if (!forms || forms.length === 0) {
            container.innerHTML = '<div style="color: #64748b;">目前沒有待審核的表單資料 🎉</div>';
            return;
        }

        forms.forEach(item => {
            const card = document.createElement('div');
            card.className = 'pending-card';
            card.innerHTML = `
                <div class="pending-info">
                    <strong>姓名：</strong>${item.name} (${item.identity})<br>
                    <strong>社費：</strong>${item.fee || '無'}<br>
                    <strong>書籍：</strong>${item.books || '無'}
                </div>
                <button class="btn-apply" onclick="applyFormToRecord(${JSON.stringify(item).replace(/"/g, '&quot;')})">帶入表單審核</button>
            `;
            container.appendChild(card);
        });
    }

    function applyFormToRecord(item) {
        document.getElementById('fromFormRowIndex').value = item.rowIndex;
        document.getElementById('description').value = `${item.name} 表單申購`;
        
        // 預設借方：現金
        document.getElementById('debitCategory').value = "資產";
        updateMainOptions('debit');
        document.getElementById('debitMain').value = "現金與存款";
        updateSubOptions('debit');
        document.getElementById('debitSub').value = "現金";

        // 預設貸方：根據書籍或社費
        document.getElementById('creditCategory').value = "收入";
        updateMainOptions('credit');

        let price = 0;
        let qty = 0;

        if (item.books) {
            document.getElementById('creditMain').value = "教材收入";
            updateSubOptions('credit');
            qty = 1;
            document.getElementById('quantity').value = 1;

            if (item.books.includes("正統")) {
                document.getElementById('creditSub').value = `${item.identity}紫微斗數正統（黃本）`;
                price = priceRules["紫微斗數正統（黃本）"][item.identity];
            } else if (item.books.includes("論命實例")) {
                document.getElementById('creditSub').value = `${item.identity}紫微斗數論命實例（藍本）`;
                price = priceRules["紫微斗數論命實例（藍本）"][item.identity];
            } else if (item.books.includes("納音")) {
                document.getElementById('creditSub').value = `${item.identity}花甲子納音`;
                price = priceRules["花甲子納音"][item.identity];
            } else if (item.books.includes("善本易經")) {
                document.getElementById('creditSub').value = "善本易經";
                price = 300;
            } else if (item.books.includes("占卜牌")) {
                document.getElementById('creditSub').value = `${item.identity}易經占卜牌`;
                price = priceRules["易經占卜牌"][item.identity];
            } else if (item.books.includes("命理基礎篇")) {
                document.getElementById('creditSub').value = "命理基礎篇";
                price = 200;
            } else if (item.books.includes("神相全編")) {
                document.getElementById('creditSub').value = "神相全編";
                price = 300;
            }
        } else if (item.fee) {
            document.getElementById('creditMain').value = "社費收入";
            updateSubOptions('credit');
            document.getElementById('quantity').value = 0;

            if (item.fee.includes("紫微")) {
                document.getElementById('creditSub').value = item.identity === "學生" ? "學生週二" : "社會人士週二";
                price = item.identity === "學生" ? 200 : 800;
            } else if (item.fee.includes("占卜牌")) {
                document.getElementById('creditSub').value = item.identity === "學生" ? "學生週三" : "社會人士週三";
                price = item.identity === "學生" ? 200 : 800;
            } else if (item.fee.includes("合報")) {
                document.getElementById('creditSub').value = item.identity === "學生" ? "學生合報" : "社會人士合報";
                price = item.identity === "學生" ? 300 : 1200;
            }
        }

        document.getElementById('debitAmount').value = price;
        document.getElementById('creditAmount').value = price;

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderInventory(invData) {
        const container = document.getElementById('inventoryContainer');
        container.innerHTML = "";
        Object.keys(invData).forEach(item => {
            const div = document.createElement('div');
            div.className = 'inventory-item';
            div.innerHTML = `
                <div class="title">${item}</div>
                <div class="count">${invData[item]} 本/套</div>
            `;
            container.appendChild(div);
        });
    }

    function renderSubTotals(totalsData) {
        const container = document.getElementById('subTotalsContainer');
        container.innerHTML = "";
        const keys = Object.keys(totalsData);
        if (keys.length === 0) {
            container.innerHTML = '<tr><td colspan="2" style="color: #64748b;">尚無交易資料</td></tr>';
            return;
        }
        keys.forEach(key => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${key}</td>
                <td style="text-align: right; font-weight: 600;">$${totalsData[key].toLocaleString()}</td>
            `;
            container.appendChild(tr);
        });
    }

    document.getElementById('accountingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        const debitAmt = Number(document.getElementById('debitAmount').value);
        const creditAmt = Number(document.getElementById('creditAmount').value);

        if (debitAmt !== creditAmt) {
            statusDiv.style.color = "var(--danger)";
            statusDiv.innerText = "❌ 試算不平衡：【借方金額】必須等於【貸方金額】！";
            return;
        }

        statusDiv.style.color = "#64748b";
        statusDiv.innerText = "⏳ 帳目發送中，請稍候...";
        document.getElementById('submitBtn').disabled = true;

        const payload = {
            date: document.getElementById('date').value,
            createdBy: document.getElementById('createdBy').value,
            description: document.getElementById('description').value,
            quantity: Number(document.getElementById('quantity').value) || 0,
            debitCategory: document.getElementById('debitCategory').value,
            debitMain: document.getElementById('debitMain').value,
            debitSub: document.getElementById('debitSub').value,
            debitAmount: debitAmt,
            creditCategory: document.getElementById('creditCategory').value,
            creditMain: document.getElementById('creditMain').value,
            creditSub: document.getElementById('creditSub').value,
            creditAmount: creditAmt,
            fromFormRowIndex: document.getElementById('fromFormRowIndex').value
        };

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if(data.result === "success") {
                statusDiv.style.color = "var(--success)";
                statusDiv.innerText = "✅ 記帳成功！已同步寫入 Google 試算表。";
                document.getElementById('accountingForm').reset();
                document.getElementById('fromFormRowIndex').value = "";
                document.getElementById('date').valueAsDate = new Date();
                document.getElementById('quantity').value = "0";
                updateMainOptions('debit');
                updateMainOptions('credit');
                fetchDashboardData();
            } else {
                throw new Error(data.message);
            }
        })
        .catch(err => {
            statusDiv.style.color = "var(--danger)";
            statusDiv.innerText = "❌ 發送失敗！請檢查 Apps Script 部署 URL 是否正確。";
        })
        .finally(() => {
            document.getElementById('submitBtn').disabled = false;
        });
    });
</script>

</body>
</html>
