<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台大易學研究社 記帳系統</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #cbd5e1;
            --debit-bg: #eff6ff;
            --debit-text: #1d4ed8;
            --credit-bg: #fff7ed;
            --credit-text: #c2410c;
            --success: #16a34a;
            --danger: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 880px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }

        h2, h3 { color: var(--primary); margin-top: 0; letter-spacing: -0.025em; }
        h2 { text-align: center; font-size: 1.6rem; margin-bottom: 24px; }
        h3 { font-size: 1.25rem; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }

        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.9em; color: #475569; }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            color: #0f172a;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .section-title {
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 0.95em;
        }

        .debit-header { background-color: var(--debit-bg); color: var(--debit-text); border-left: 4px solid var(--debit-text); }
        .credit-header { background-color: var(--credit-bg); color: var(--credit-text); border-left: 4px solid var(--credit-text); }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .status { margin-top: 18px; font-weight: 600; text-align: center; font-size: 0.95em; }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .inventory-item {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px 16px;
            border-left: 4px solid var(--primary);
        }

        .inventory-item .title { font-size: 0.85em; color: #64748b; font-weight: 600; }
        .inventory-item .count { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-top: 4px; }

        .totals-table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
        .totals-table th, .totals-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
        .totals-table th { background-color: #f8fafc; color: #475569; font-weight: 600; }

        .pending-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .pending-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .pending-title { font-weight: 700; font-size: 1.05em; color: var(--primary); }
        .entry-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
            margin-bottom: 14px;
        }
        .entry-table th, .entry-table td { padding: 8px; text-align: left; border-bottom: 1px dashed #e2e8f0; }
        .entry-table th { background: #f8fafc; color: #64748b; }
        .tag-debit { color: var(--debit-text); font-weight: 700; }
        .tag-credit { color: var(--credit-text); font-weight: 700; }

        .btn-approve {
            background: var(--success);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9em;
            width: 100%;
        }
        .btn-approve:hover { background: #15803d; }

        @media (max-width: 640px) {
            body { padding: 12px; margin: 10px auto; }
            .card { padding: 18px; }
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>台大易學研究社 記帳系統</h2>
    
    <form id="accountingForm">
        <div class="grid-2">
            <div class="form-group">
                <label>交易日期</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>經手 / 記帳人</label>
                <select id="createdBy" required>
                    <option value="">-- 請選擇幹部 --</option>
                    <option value="總務">總務</option>
                    <option value="社長">社長</option>
                    <option value="副總務">副總務</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>交易摘要 / 事由說明 (選填)</label>
                <input type="text" id="description" placeholder="例如：張小明購買紫微斗數正統">
            </div>
            <div class="form-group">
                <label>教材異動數量 (本/套，非教材填 0)</label>
                <input type="number" id="quantity" placeholder="0" min="0" value="0" required>
            </div>
        </div>

        <!-- 借方區塊 -->
        <div class="form-group">
            <div class="section-title debit-header">【借方 Debit】資金流入 / 費用發生 / 負債減少</div>
            <div class="grid-3">
                <div>
                    <label>大類</label>
                    <select id="debitCategory" onchange="updateMainOptions('debit')" required>
                        <option value="">-- 請選擇 --</option>
                    </select>
                </div>
                <div>
                    <label>主項目</label>
                    <select id="debitMain" onchange="updateSubOptions('debit')" required>
                        <option value="">-- 請先選大類 --</option>
                    </select>
                </div>
                <div>
                    <label>次級子項目</label>
                    <select id="debitSub" required>
                        <option value="">-- 請先選主項目 --</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label>借方金額 ($)</label>
                <input type="number" id="debitAmount" placeholder="0" min="1" required>
            </div>
        </div>

        <!-- 貸方區塊 -->
        <div class="form-group">
            <div class="section-title credit-header">【貸方 Credit】資金流出 / 收入增加 / 負債增加</div>
            <div class="grid-3">
                <div>
                    <label>大類</label>
                    <select id="creditCategory" onchange="updateMainOptions('credit')" required>
                        <option value="">-- 請選擇 --</option>
                    </select>
                </div>
                <div>
                    <label>主項目</label>
                    <select id="creditMain" onchange="updateSubOptions('credit')" required>
                        <option value="">-- 請先選大類 --</option>
                    </select>
                </div>
                <div>
                    <label>次級子項目</label>
                    <select id="creditSub" required>
                        <option value="">-- 請先選主項目 --</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label>貸方金額 ($)</label>
                <input type="number" id="creditAmount" placeholder="0" min="1" required>
            </div>
        </div>

        <button type="submit" id="submitBtn">提交單筆帳目</button>
    </form>

    <div id="status" class="status"></div>
</div>

<!-- 待審核表單看板 -->
<div class="card">
    <h3>📋 待審核 Google 表單交易</h3>
    <div id="pendingFormsContainer">
        <div style="color: #64748b;">載入待審核表單中...</div>
    </div>
</div>

<!-- 庫存看板 -->
<div class="card">
    <h3>📦 易學社教材即時庫存</h3>
    <div id="inventoryContainer" class="inventory-grid">
        <div style="color: #64748b;">載入庫存數據中...</div>
    </div>
</div>

<!-- 各子項目累計 -->
<div class="card">
    <h3>💰 各子項目累計金額統計</h3>
    <table class="totals-table">
        <thead>
            <tr>
                <th>主項目 - 子項目</th>
                <th style="text-align: right;">累計總金額 ($)</th>
            </tr>
        </thead>
        <tbody id="subTotalsContainer">
            <tr><td colspan="2" style="color: #64748b;">載入統計數據中...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // ⚠️ 請替換為您的 Google Apps Script 部署 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxJC_us9XaEbewRpjU31CnSViTLiQVwhEs2IE88xqV26O7t2sPVb8iEEd8NjznEKxTy/exec";

    const accountTree = {
        "收入": {
            "教材收入": [
                "學生紫微斗數正統（黃本）", "社會人士紫微斗數正統（黃本）",
                "學生紫微斗數論命實例（藍本）", "社會人士紫微斗數論命實例（藍本）",
                "學生花甲子納音", "社會人士花甲子納音",
                "善本易經", "學生易經占卜牌", "社會人士易經占卜牌",
                "命理基礎篇", "神相全編"
            ],
            "社費收入": [
                "學生週二", "社會人士週二",
                "學生週三", "社會人士週三",
                "學生合報", "社會人士合報"
            ]
        },
        "費損": {
            "活動支出": ["場地租用", "茶水餐飲", "宣傳印製", "老師", "社員聚餐", "其他"],
            "行政支出": ["教室租用", "影印費", "軟體訂閱", "其他"]
        },
        "資產": {
            "現金與存款": ["社團郵局帳戶", "現金"],
            "教材庫存": [
                "紫微斗數正統（黃本）", "紫微斗數論命實例（藍本）", "花甲子納音",
                "善本易經", "易經占卜牌", "命理基礎篇", "神相全編"
            ]
        },
        "負債": {
            "預收款": ["教材"]
        }
    };

    let cachedPendingForms = [];

    window.onload = function() {
        document.getElementById('date').valueAsDate = new Date();
        initCategories('debit');
        initCategories('credit');
        fetchDashboardData();
    };

    function initCategories(side) {
        const catSelect = document.getElementById(`${side}Category`);
        catSelect.innerHTML = '<option value="">-- 請選擇 --</option>';
        Object.keys(accountTree).forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.innerText = cat;
            catSelect.appendChild(opt);
        });
    }

    function updateMainOptions(side) {
        const cat = document.getElementById(`${side}Category`).value;
        const mainSelect = document.getElementById(`${side}Main`);
        const subSelect = document.getElementById(`${side}Sub`);

        mainSelect.innerHTML = '<option value="">-- 請選擇主項目 --</option>';
        subSelect.innerHTML = '<option value="">-- 請先選主項目 --</option>';

        if (cat && accountTree[cat]) {
            Object.keys(accountTree[cat]).forEach(main => {
                const opt = document.createElement("option");
                opt.value = main;
                opt.innerText = main;
                mainSelect.appendChild(opt);
            });
        }
    }

    function updateSubOptions(side) {
        const cat = document.getElementById(`${side}Category`).value;
        const main = document.getElementById(`${side}Main`).value;
        const subSelect = document.getElementById(`${side}Sub`);

        subSelect.innerHTML = '<option value="">-- 請選擇次級子項目 --</option>';

        if (cat && main && accountTree[cat][main]) {
            accountTree[cat][main].forEach(sub => {
                const opt = document.createElement("option");
                opt.value = sub;
                opt.innerText = sub;
                subSelect.appendChild(opt);
            });
        }
    }

    function fetchDashboardData() {
        fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
            if (data.result === "success") {
                renderInventory(data.inventory);
                renderSubTotals(data.subTotals);
                cachedPendingForms = data.pendingForms || [];
                renderPendingForms(cachedPendingForms);
            }
        })
        .catch(err => console.error("資料載入失敗:", err));
    }

    function renderPendingForms(forms) {
        const container = document.getElementById('pendingFormsContainer');
        container.innerHTML = "";
        if (!forms || forms.length === 0) {
            container.innerHTML = '<div style="color: #64748b;">目前沒有待審核的表單資料 🎉</div>';
            return;
        }

        forms.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'pending-card';
            
            let tableRows = `
                <tr>
                    <td><span class="tag-debit">【借】</span> ${item.debitEntry.cat}-${item.debitEntry.main}</td>
                    <td>${item.debitEntry.sub}</td>
                    <td style="text-align:right;">$${item.debitEntry.amount.toLocaleString()}</td>
                    <td style="text-align:center;">0</td>
                </tr>
            `;

            item.creditEntries.forEach(c => {
                tableRows += `
                    <tr>
                        <td><span class="tag-credit">【貸】</span> ${c.cat}-${c.main}</td>
                        <td>${c.sub}</td>
                        <td style="text-align:right;">$${c.amount.toLocaleString()}</td>
                        <td style="text-align:center;">${c.qty}</td>
                    </tr>
                `;
            });

            card.innerHTML = `
                <div class="pending-header">
                    <div class="pending-title">📋 申購人：${item.name} (${item.identity})</div>
                    <div style="font-weight:700; color:var(--primary);">傳票總金額：$${item.totalAmount.toLocaleString()}</div>
                </div>
                <table class="entry-table">
                    <thead>
                        <tr>
                            <th>借/貸 & 項目大類</th>
                            <th>次級子項目</th>
                            <th style="text-align:right;">金額 ($)</th>
                            <th style="text-align:center;">數量</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <button class="btn-approve" onclick="approveBatchForm(${index})">✅ 一鍵核准這筆複合分錄入帳</button>
            `;
            container.appendChild(card);
        });
    }

    function approveBatchForm(index) {
        const item = cachedPendingForms[index];
        if (!item) return;

        const currentCreatedBy = document.getElementById('createdBy').value;
        if (!currentCreatedBy) {
            alert("⚠️ 請先在上方選擇【經手 / 記帳人】（如：總務/社長），才能核准入帳喔！");
            document.getElementById('createdBy').focus();
            return;
        }

        const statusDiv = document.getElementById('status');
        statusDiv.style.color = "#64748b";
        statusDiv.innerText = `⏳ 正在將 ${item.name} 的複合分錄寫入正式帳冊...`;

        const todayStr = new Date().toISOString().split('T')[0];
        const desc = `${item.name} 表單申購`;

        const batchRows = [];

        // 1. 借方列
        batchRows.push({
            date: todayStr,
            createdBy: currentCreatedBy,
            description: desc,
            debitCategory: item.debitEntry.cat,
            debitMain: item.debitEntry.main,
            debitSub: item.debitEntry.sub,
            debitAmount: item.debitEntry.amount,
            creditCategory: "", creditMain: "", creditSub: "", creditAmount: 0,
            quantity: 0
        });

        // 2. 貸方列
        item.creditEntries.forEach(c => {
            batchRows.push({
                date: todayStr,
                createdBy: currentCreatedBy,
                description: desc,
                debitCategory: "", debitMain: "", debitSub: "", debitAmount: 0,
                creditCategory: c.cat,
                creditMain: c.main,
                creditSub: c.sub,
                creditAmount: c.amount,
                quantity: c.qty
            });
        });

        const payload = {
            batchRows: batchRows,
            fromFormRowIndex: item.rowIndex
        };

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === "success") {
                statusDiv.style.color = "var(--success)";
                statusDiv.innerText = `✅ 成功入帳 ${item.name} 的表單交易！`;
                fetchDashboardData();
            } else {
                throw new Error(data.message);
            }
        })
        .catch(err => {
            statusDiv.style.color = "var(--danger)";
            statusDiv.innerText = "❌ 入帳失敗，請檢查網路連線或 Apps Script 部署網址。";
        });
    }

    function renderInventory(invData) {
        const container = document.getElementById('inventoryContainer');
        container.innerHTML = "";
        Object.keys(invData).forEach(item => {
            const div = document.createElement('div');
            div.className = 'inventory-item';
            div.innerHTML = `
                <div class="title">${item}</div>
                <div class="count">${invData[item]} 本/套</div>
            `;
            container.appendChild(div);
        });
    }

    function renderSubTotals(totalsData) {
        const container = document.getElementById('subTotalsContainer');
        container.innerHTML = "";
        const keys = Object.keys(totalsData);
        if (keys.length === 0) {
            container.innerHTML = '<tr><td colspan="2" style="color: #64748b;">尚無交易資料</td></tr>';
            return;
        }
        keys.forEach(key => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${key}</td>
                <td style="text-align: right; font-weight: 600;">$${totalsData[key].toLocaleString()}</td>
            `;
            container.appendChild(tr);
        });
    }

    document.getElementById('accountingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        const debitAmt = Number(document.getElementById('debitAmount').value);
        const creditAmt = Number(document.getElementById('creditAmount').value);

        if (debitAmt !== creditAmt) {
            statusDiv.style.color = "var(--danger)";
            statusDiv.innerText = "❌ 試算不平衡：【借方金額】必須等於【貸方金額】！";
            return;
        }

        statusDiv.style.color = "#64748b";
        statusDiv.innerText = "⏳ 帳目發送中，請稍候...";
        document.getElementById('submitBtn').disabled = true;

        const payload = {
            date: document.getElementById('date').value,
            createdBy: document.getElementById('createdBy').value,
            description: document.getElementById('description').value,
            quantity: Number(document.getElementById('quantity').value) || 0,
            debitCategory: document.getElementById('debitCategory').value,
            debitMain: document.getElementById('debitMain').value,
            debitSub: document.getElementById('debitSub').value,
            debitAmount: debitAmt,
            creditCategory: document.getElementById('creditCategory').value,
            creditMain: document.getElementById('creditMain').value,
            creditSub: document.getElementById('creditSub').value,
            creditAmount: creditAmt
        };

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if(data.result === "success") {
                statusDiv.style.color = "var(--success)";
                statusDiv.innerText = "✅ 記帳成功！已同步寫入 Google 試算表。";
                document.getElementById('accountingForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                document.getElementById('quantity').value = "0";
                updateMainOptions('debit');
                updateMainOptions('credit');
                fetchDashboardData();
            } else {
                throw new Error(data.message);
            }
        })
        .catch(err => {
            statusDiv.style.color = "var(--danger)";
            statusDiv.innerText = "❌ 發送失敗！請檢查 Apps Script 部署 URL 是否正確。";
        })
        .finally(() => {
            document.getElementById('submitBtn').disabled = false;
        });
    });
</script>

</body>
</html>
