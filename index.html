<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台大易學研究社 記帳系統</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #cbd5e1;
            --income-color: #16a34a;
            --expense-color: #dc2626;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 920px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }

        h2, h3, h4 { color: var(--primary); margin-top: 0; letter-spacing: -0.025em; }
        h2 { text-align: center; font-size: 1.6rem; margin-bottom: 24px; }
        h3 { font-size: 1.2rem; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }

        .form-row {
            display: grid;
            grid-template-columns: 0.8fr 1.1fr 1.2fr 0.9fr 0.7fr 1.2fr 40px;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        label { font-weight: 600; display: block; margin-bottom: 4px; font-size: 0.85em; color: #475569; }
        
        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
            background-color: #fff;
            color: #0f172a;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .btn-add-row {
            background: #eff6ff;
            color: var(--primary);
            border: 1px dashed var(--primary);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
        }
        .btn-add-row:hover { background: #dbeafe; }

        .btn-remove-row {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 6px;
            height: 34px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-remove-row:hover { background: #fca5a5; }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover { background-color: var(--primary-hover); }

        .status { margin-top: 14px; font-weight: 600; text-align: center; font-size: 0.95em; }

        /* 統計看板樣式 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .dash-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            border: 1px solid #e2e8f0;
        }
        .dash-card.income-card { border-top: 4px solid var(--income-color); }
        .dash-card.expense-card { border-top: 4px solid var(--expense-color); }

        .dash-list { list-style: none; padding: 0; margin: 0; font-size: 0.9em; }
        .dash-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #f1f5f9;
        }

        .total-summary-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            margin-top: 16px;
        }
        .total-summary-val { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-top: 4px; }

        /* 庫存看板 */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }
        .inventory-item {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 10px 14px;
            border-left: 4px solid var(--primary);
        }
        .inventory-item .title { font-size: 0.8em; color: #64748b; font-weight: 600; }
        .inventory-item .count { font-size: 1.2rem; font-weight: 700; color: #0f172a; margin-top: 2px; }

        /* 待審核區塊 */
        .pending-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .pending-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .btn-approve { background: var(--income-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; flex: 1; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 30%; }

        /* QR Code */
        .qr-section { text-align: center; padding: 16px 0; color: #475569; }
        .qr-section img { border-radius: 8px; border: 1px solid #cbd5e1; padding: 8px; background: #fff; margin-bottom: 8px; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr 1fr; gap: 6px; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>台大易學研究社 記帳系統</h2>
    
    <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-weight: 600; color: #475569;">交易日期：<input type="date" id="commonDate" style="width: auto; display: inline-block;"></div>
        <div style="font-weight: 700; color: var(--primary);">本次填寫總金額：$<span id="totalFormAmount">0</span></div>
    </div>

    <form id="multiAccountingForm">
        <div id="rowsContainer"></div>

        <button type="button" class="btn-add-row" onclick="addNewRow()">➕ 新增下一筆明細</button>
        <button type="submit" class="submit-btn" id="submitBtn">提交所有明細分錄</button>
    </form>

    <div id="status" class="status"></div>
</div>

<!-- 待審核表單看板 -->
<div class="card">
    <h3>📋 待審核 Google 表單申購</h3>
    <div id="pendingFormsContainer">
        <div style="color: #64748b;">載入待審核表單中...</div>
    </div>
</div>

<!-- 庫存看板 -->
<div class="card">
    <h3>📦 易學社教材即時庫存</h3>
    <div id="inventoryContainer" class="inventory-grid">
        <div style="color: #64748b;">載入庫存數據中...</div>
    </div>
</div>

<!-- 財務統計看板 -->
<div class="card">
    <h3>📊 社團財務統計看板</h3>
    
    <div id="initialFundBanner" style="background: #f8fafc; padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 14px; font-weight: 600;">
        🏛️ 期初移交資金：$<span id="initialFundVal">0</span>
    </div>

    <div class="dashboard-grid">
        <div class="dash-card income-card">
            <h4>📈 本期收入 (Income)</h4>
            <ul class="dash-list" id="incomeList"><li>尚無記錄</li></ul>
            <div style="text-align: right; margin-top: 10px; font-weight: 700; color: var(--income-color);">收入小計：$<span id="incomeSubTotal">0</span></div>
        </div>

        <div class="dash-card expense-card">
            <h4>📉 本期支出 (Expenses)</h4>
            <ul class="dash-list" id="expenseList"><li>尚無記錄</li></ul>
            <div style="text-align: right; margin-top: 10px; font-weight: 700; color: var(--expense-color);">支出小計：$<span id="expenseSubTotal">0</span></div>
        </div>
    </div>

    <div class="total-summary-card">
        <div style="font-weight: 700; color: #475569;">💰 社團目前總結餘 (Net Balance)</div>
        <div class="total-summary-val">$<span id="netBalanceVal">0</span></div>
        <div style="font-size: 0.85em; color: #64748b; margin-top: 4px;">(計算公式：期初資金 + 本期收入 - 本期支出)</div>
    </div>
</div>

<!-- 底部 QR Code 區塊 -->
<div class="qr-section">
    <h4>📱 掃描填寫社團購買表單</h4>
    <img src="https://quickchart.io/qr?text=https://docs.google.com/forms/d/e/1FAIpQLSdkpG5yMaTAjyo8TS636vqCl90yro71XtId_9vBW15OZ2ICdA/viewform&size=140" alt="表單 QR Code">
    <div><a href="https://docs.google.com/forms/d/e/1FAIpQLSdkpG5yMaTAjyo8TS636vqCl90yro71XtId_9vBW15OZ2ICdA/viewform" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 600;">點此開啟表單連結</a></div>
</div>

<script>
    // ⚠️ 請替換為您的 Google Apps Script 部署 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwo4wpgLNYLNB_OPAD9pyGskjWHUJ6aixnPDnHA4ZP7mewem4rHxpF5lSF46PYL1x1h/exec";

    const accountStructure = {
        "期初開帳": {
            "期初開帳": ["期初現金結餘", "期初黃本盤點", "期初藍本盤點", "期初納音盤點", "期初善本易經盤點", "期初易經占卜牌盤點", "期初命理基礎篇盤點", "期初神相全編盤點"]
        },
        "收入": {
            "社費收入": ["學生週二", "社會人士週二", "學生週三", "社會人士週三", "學生合報", "社會人士合報"],
            "教材收入": ["學生黃本", "社會人士黃本", "學生藍本", "社會人士藍本", "學生納音", "社會人士納音", "善本易經", "學生易經占卜牌", "社會人士易經占卜牌", "命理基礎篇", "神相全編"],
            "其他收入": ["活動收入", "課外組補助", "其他收入"]
        },
        "支出": {
            "活動支出": ["場地租用", "茶水餐飲", "宣傳印製", "講師鐘點費", "社員聚餐", "活動道具與雜支"],
            "行政支出": ["教室租用", "影印費", "軟體與訂閱費", "教材進貨成本", "行政雜支"]
        }
    };

    let cachedPendingForms = [];
    let rowCounter = 0;

    window.onload = function() {
        document.getElementById('commonDate').valueAsDate = new Date();
        addNewRow();
        fetchDashboardData();
    };

    function addNewRow() {
        if (document.querySelectorAll('.form-row').length >= 10) {
            alert("一次最多新增 10 列明細喔！");
            return;
        }

        rowCounter++;
        const rowId = `row_${rowCounter}`;
        const container = document.getElementById('rowsContainer');

        const rowDiv = document.createElement('div');
        rowDiv.className = 'form-row';
        rowDiv.id = rowId;

        rowDiv.innerHTML = `
            <div>
                <label>收/支</label>
                <select onchange="onTypeChange('${rowId}')" class="row-type" required>
                    <option value="收入">收入 (+)</option>
                    <option value="支出">支出 (-)</option>
                    <option value="期初開帳">期初開帳</option>
                </select>
            </div>
            <div>
                <label>大類</label>
                <select onchange="onCategoryChange('${rowId}')" class="row-category" required></select>
            </div>
            <div>
                <label>子項目</label>
                <select class="row-sub" required></select>
            </div>
            <div>
                <label>金額 ($)</label>
                <input type="number" class="row-amount" placeholder="0" min="0" oninput="calculateTotalAmount()" required>
            </div>
            <div>
                <label>數量(本)</label>
                <input type="number" class="row-qty" placeholder="0" min="0" value="0" required>
            </div>
            <div>
                <label>摘要/備註</label>
                <input type="text" class="row-desc" placeholder="事由說明">
            </div>
            <div style="display:flex; align-items:flex-end;">
                <button type="button" class="btn-remove-row" onclick="removeRow('${rowId}')">🗑️</button>
            </div>
        `;

        container.appendChild(rowDiv);
        onTypeChange(rowId);
    }

    function removeRow(rowId) {
        const rows = document.querySelectorAll('.form-row');
        if (rows.length <= 1) {
            alert("最少需要保留一列輸入欄！");
            return;
        }
        document.getElementById(rowId).remove();
        calculateTotalAmount();
    }

    function onTypeChange(rowId) {
        const row = document.getElementById(rowId);
        const type = row.querySelector('.row-type').value;
        const catSelect = row.querySelector('.row-category');

        catSelect.innerHTML = "";
        let targetType = type === "期初開帳" ? "期初開帳" : type;

        if (accountStructure[targetType]) {
            Object.keys(accountStructure[targetType]).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                catSelect.appendChild(opt);
            });
        }
        onCategoryChange(rowId);
    }

    function onCategoryChange(rowId) {
        const row = document.getElementById(rowId);
        const type = row.querySelector('.row-type').value;
        const cat = row.querySelector('.row-category').value;
        const subSelect = row.querySelector('.row-sub');

        subSelect.innerHTML = "";
        let targetType = type === "期初開帳" ? "期初開帳" : type;

        if (accountStructure[targetType] && accountStructure[targetType][cat]) {
            accountStructure[targetType][cat].forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.innerText = sub;
                subSelect.appendChild(opt);
            });
        }
    }

    function calculateTotalAmount() {
        let total = 0;
        document.querySelectorAll('.row-amount').forEach(input => {
            total += Number(input.value) || 0;
        });
        document.getElementById('totalFormAmount').innerText = total.toLocaleString();
    }

    function fetchDashboardData() {
        fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
            if (data.result === "success") {
                document.getElementById('initialFundVal').innerText = data.initialFund.toLocaleString();
                document.getElementById('incomeSubTotal').innerText = data.totalIncome.toLocaleString();
                document.getElementById('expenseSubTotal').innerText = data.totalExpense.toLocaleString();
                document.getElementById('netBalanceVal').innerText = data.netBalance.toLocaleString();

                renderInventory(data.inventory);
                renderDashList('incomeList', data.incomeTotals);
                renderDashList('expenseList', data.expenseTotals);
                
                cachedPendingForms = data.pendingForms || [];
                renderPendingForms(cachedPendingForms);
            }
        });
    }

    function renderDashList(elementId, dataMap) {
        const list = document.getElementById(elementId);
        list.innerHTML = "";
        const keys = Object.keys(dataMap);
        if (keys.length === 0) {
            list.innerHTML = "<li>尚無記錄</li>";
            return;
        }
        keys.forEach(k => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${k}</span><span style="font-weight:700;">$${dataMap[k].toLocaleString()}</span>`;
            list.appendChild(li);
        });
    }

    function renderInventory(invData) {
        const container = document.getElementById('inventoryContainer');
        container.innerHTML = "";
        Object.keys(invData).forEach(item => {
            const div = document.createElement('div');
            div.className = 'inventory-item';
            div.innerHTML = `<div class="title">${item}</div><div class="count">${invData[item]} 本/套</div>`;
            container.appendChild(div);
        });
    }

    function renderPendingForms(forms) {
        const container = document.getElementById('pendingFormsContainer');
        container.innerHTML = "";
        if (!forms || forms.length === 0) {
            container.innerHTML = '<div style="color: #64748b;">目前沒有待審核的表單資料 🎉</div>';
            return;
        }

        forms.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'pending-card';
            
            let itemRows = "";
            item.items.forEach(it => {
                itemRows += `<div style="font-size:0.9em; color:#475569; margin-top:4px;">• ${it.category} - ${it.subItem} ($${it.amount})</div>`;
            });

            card.innerHTML = `
                <div class="pending-header">
                    <div style="font-weight:700; color:var(--primary);">📋 申購人：${item.name} (${item.identity})</div>
                    <div style="font-weight:700; color:var(--income-color);">總金額：$${item.totalAmount.toLocaleString()}</div>
                </div>
                ${itemRows}
                <div class="action-btns">
                    <button class="btn-approve" onclick="approveForm(${index})">✅ 核准入帳</button>
                    <button class="btn-delete" onclick="deleteForm(${index})">🗑️ 廢棄刪除</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function approveForm(index) {
        const item = cachedPendingForms[index];
        if (!item) return;

        const statusDiv = document.getElementById('status');
        statusDiv.style.color = "#64748b";
        statusDiv.innerText = `⏳ 正在將 ${item.name} 的表單資料寫入正式帳冊...`;

        const todayStr = new Date().toISOString().split('T')[0];
        const batchRows = [];

        item.items.forEach(it => {
            batchRows.push({
                date: todayStr,
                type: "收入",
                category: it.category,
                subItem: it.subItem,
                amount: it.amount,
                quantity: it.qty,
                description: `${item.name} 表單申購`
            });
        });

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ batchRows: batchRows, fromFormRowIndex: item.rowIndex })
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === "success") {
                statusDiv.style.color = "var(--income-color)";
                statusDiv.innerText = `✅ 成功入帳 ${item.name} 的表單資料！`;
                fetchDashboardData();
            }
        });
    }

    function deleteForm(index) {
        const item = cachedPendingForms[index];
        if (!item || !confirm(`確定要廢棄刪除 ${item.name} 的申購單嗎？`)) return;

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "delete", fromFormRowIndex: item.rowIndex })
        })
        .then(res => res.json())
        .then(data => {
            if(data.result === "success") {
                fetchDashboardData();
            }
        });
    }

    document.getElementById('multiAccountingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        const commonDate = document.getElementById('commonDate').value;

        const rowElements = document.querySelectorAll('.form-row');
        const batchRows = [];

        rowElements.forEach(row => {
            batchRows.push({
                date: commonDate,
                type: row.querySelector('.row-type').value,
                category: row.querySelector('.row-category').value,
                subItem: row.querySelector('.row-sub').value,
                amount: Number(row.querySelector('.row-amount').value) || 0,
                quantity: Number(row.querySelector('.row-qty').value) || 0,
                description: row.querySelector('.row-desc').value
            });
        });

        statusDiv.style.color = "#64748b";
        statusDiv.innerText = "⏳ 批次寫入帳目中...";
        document.getElementById('submitBtn').disabled = true;

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ batchRows: batchRows })
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === "success") {
                statusDiv.style.color = "var(--income-color)";
                statusDiv.innerText = "✅ 成功批次寫入所有帳目！試算表已完成自動上色。";
                
                // 重置表單
                document.getElementById('rowsContainer').innerHTML = "";
                rowCounter = 0;
                addNewRow();
                calculateTotalAmount();
                fetchDashboardData();
            } else {
                throw new Error(data.message);
            }
        })
        .catch(err => {
            statusDiv.style.color = "var(--danger)";
            statusDiv.innerText = "❌ 發送失敗！請檢查 Apps Script 部署 URL 是否正確。";
        })
        .finally(() => {
            document.getElementById('submitBtn').disabled = false;
        });
    });
</script>

</body>
</html>
